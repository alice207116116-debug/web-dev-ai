<!-- 현재 문서가 HTML5언어로 작성된 웹 문서 -->
<!DOCTYPE html>
<html><!-- 웹 문서의 시작과 끝 -->
    <head>
        <!-- 웹 문서의 정보 -->
        <title>문서 제목</title>
        <!-- 문자 인코딩 UTF=8 설정 -->
        <meta charset="UTF=8">
        <meta name="discription" content="문서 설명을 여기에 작성합니다.">
        <meta name="author" content="문서 작성자">
        <!-- 모바일 화면 설정
         - width=divice-width : 화면 너머에 맞춤 
         - initial-scal=1.0 : 초기 확대 비율
         - viewport-fit=cover : 노치(상단 카메라/센서)까지 화면 사용 -->
        <meta name="viewport">
        <!-- Graph 공유 카드 : 카카오톡 등 링크 공유할 때 미리보기 -->
        <meta property="og:title" content="문서 제목">
        <meta property="og:description" content="문서 설명">
        <meta property="og:image" content="페이지 화면 이미지">
        <meta property="og:url" content="현재 페이지 URL 주소">

        <!-- 파비콘 설정 -->
        <link rel="icon" href="favicom.png">
    </head>
