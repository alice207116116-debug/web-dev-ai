<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록 태그 </title>
</head>
<body>
    <h2>ul(unordered list) : 순서 없는 목록</h2>
    <ul> 
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
    </ul>
    <h2>ol(ordered list) : 순서 있는 목록</h2>
    <!-- ol>li*3-->
    <ol type="A" start="3">
        <li>기획</li>
        <li>디자인</li>
        <li>개발</li>
    </ol>

    <h2> 중첩 목록 - 목록 안에 다른 목록 </h2>
    <ul>
        <li>HTML</li>
            <ul>
                <li>텍스트 태그</li>
                <li>목록 태그</li>
            </ul>
        </li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h2> 정의 목록 </h2>
    <dl>
        <dt>HTML</dt>
        <dd>웹 문서를 작성하기 위한 마크업 언어</dd>
       </dl>
</body>
</html>
